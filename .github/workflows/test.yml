name: test

on:
  push:
    branches: [main, rev377]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # Why: @vvago/vale's postinstall downloads the Vale binary from GitHub releases, which
      # returned HTTP 504 on several runs (42571069871, 42581969085); retry the install, not the tests.
      - name: install dependencies
        run: |
          for attempt in 1 2 3 4; do
            bun install --frozen-lockfile && exit 0
            echo "bun install failed (attempt $attempt); retrying in $((attempt * 30)) s"
            sleep $((attempt * 30))
          done
          exit 1

      # Why: every browser and worker entry, both targets, before the test that requires them
      # (pitfall 7). There is no production key on a hosted runner, so the prod compile is the
      # dummy-marker check; bundleDefines asserts the marker.
      - name: build every target
        run: bun run build:all-targets -- --dummy-rsa

      # Why: output integrity and generator staleness only; the content- and engine-backed --check
      # runs are local, receipted gates (section 3, Q11).
      - name: data manifest
        run: bun tools/lib/manifest.ts verify

      - name: unit tests
        run: |
          set -o pipefail
          bun test 2>&1 | tee "$RUNNER_TEMP/bun-test.log"

      - name: typecheck
        run: bun run typecheck

      - name: lint
        run: bun run lint

      - name: prose
        run: bun run lint:prose

      - name: prose extras
        run: bun run lint:prose:extras

      # Why: a green hosted run must say what it did not check; every SKIP line names its input.
      - name: skip summary
        if: always()
        run: |
          {
            echo '## Skipped checks'
            echo ''
            if [ -f "$RUNNER_TEMP/bun-test.log" ]; then
              grep -E '^SKIP: ' "$RUNNER_TEMP/bun-test.log" || echo 'None reported.'
            else
              echo 'The test step did not produce a log.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
